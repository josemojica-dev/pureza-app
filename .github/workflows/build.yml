name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "pureza-mobile (1)/pureza-mobile"
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar actualizacion
        working-directory: .
        run: |
          if [ -d "actualizacion-pureza/pureza-mobile (1)/pureza-mobile" ]; then
            cp -r "actualizacion-pureza/pureza-mobile (1)/pureza-mobile/." "pureza-mobile (1)/pureza-mobile/"
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Pureza-APK
          path: pureza-mobile (1)/pureza-mobile/android/app/build/outputs/apk/debug/app-debug.apk
